<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#5642d6" />
  <title>Offline · Pet Shelter</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f4f2fb; color: #1d1a33; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5; }
    main { width: 100%; max-width: 420px; text-align: center; background: #fff; border: 1px solid #e1ddf0; border-radius: 16px; padding: 32px 24px; }
    svg { width: 72px; height: 72px; color: #5642d6; }
    h1 { margin: 12px 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 20px; color: #6b6785; }
    button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 10px; background: #5642d6; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #status { min-height: 1.5em; margin-top: 16px; margin-bottom: 0; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 10 5.2M5 12.9a10 10 0 0 1 5.2-2.8M19 12.9a10 10 0 0 0-2.4-1.8M8.5 16.4a5 5 0 0 1 7 0M12 20h.01M2 2l20 20" />
    </svg>
    <h1>You are offline</h1>
    <p>This page could not be loaded because there is no internet connection. Pages you have already opened and saved data stay available once you are back in the app.</p>
    <button id="retry" type="button">Retry Connection</button>
    <p id="status" role="status"></p>
  </main>
  <script>
    // The app lives in the folder of the service worker (its scope). Find it so the links work from any address.
    async function appBase() {
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) return reg.scope;
      } catch (e) {}
      return new URL("./", location.href).href;
    }
    document.getElementById("retry").addEventListener("click", async () => {
      const button = document.getElementById("retry");
      const status = document.getElementById("status");
      button.disabled = true;
      status.textContent = "Checking the connection…";
      const base = await appBase();
      try {
        // ping.txt is never cached, so this is a real network request.
        const res = await fetch(base + "ping.txt?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("not ok");
        location.replace(base);
      } catch (e) {
        status.textContent = "Still offline. Check your connection and try again.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
